
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lamie Flower Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Zen+Old+Mincho:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: {
                50: '#FDFCF8',
                100: '#F9F7F2', // Primary BG
                200: '#F2EDE6',
              },
              mocha: {
                100: '#DCCFC6',
                300: '#8C7B70', // Secondary Text
                500: '#6E5D4E',
                800: '#5E4B3E', // Primary Text/Logo
                900: '#4A3B32',
              }
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              display: ['"Cormorant Garamond"', 'serif'],
              body: ['"Zen Old Mincho"', 'serif'], // Gives that Asian aesthetic feel
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'fade-in-up': 'fadeInUp 1s ease-out forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F9F7F2;
      }
      ::-webkit-scrollbar-thumb {
        background: #DCCFC6;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8C7B70;
      }
      @keyframes filmTrack {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }
      .animate-film-track {
        animation: filmTrack 52s linear infinite;
      }
      .animate-film-track-delay {
        animation: filmTrack 62s linear infinite;
        animation-delay: -18s;
      }
      .animate-film-track-slow {
        animation: filmTrack 72s linear infinite;
        animation-delay: -32s;
      }
      .animate-gallery-marquee {
        animation: filmTrack 96s linear infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body class="bg-cream-100 text-mocha-800 antialiased selection:bg-mocha-100 selection:text-mocha-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
