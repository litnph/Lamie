
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lamie Flower Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Zen+Old+Mincho:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: {
                50: 'var(--color-canvas)',
                100: 'var(--color-surface-subtle)',
                200: 'var(--color-border-subtle)',
              },
              mocha: {
                100: 'var(--lamie-mocha-100)',
                200: 'var(--lamie-mocha-200)',
                300: 'var(--color-text-muted)',
                400: 'var(--lamie-mocha-400)',
                500: 'var(--lamie-mocha-500)',
                600: 'var(--color-text-secondary)',
                700: 'var(--lamie-mocha-700)',
                800: 'var(--color-action-primary)',
                900: 'var(--color-text-primary)',
              }
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              display: ['"Cormorant Garamond"', 'serif'],
              body: ['"Zen Old Mincho"', 'serif'], // Gives that Asian aesthetic feel
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'fade-in-up': 'fadeInUp 1s ease-out forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light;

        --lamie-paper-0: #fffefa;
        --lamie-paper-50: #fbfaf5;
        --lamie-paper-100: #f5f2e9;
        --lamie-paper-200: #e9e3d8;
        --lamie-stem-300: #a9ad99;
        --lamie-stem-500: #747a67;
        --lamie-stem-700: #4d5447;
        --lamie-mocha-100: #ded4cc;
        --lamie-mocha-200: #c8bab0;
        --lamie-mocha-300: #988b82;
        --lamie-mocha-400: #82736a;
        --lamie-mocha-500: #74645a;
        --lamie-mocha-700: #55463e;
        --lamie-mocha-900: #342b27;
        --lamie-rose-100: #f1dfdf;
        --lamie-rose-500: #a45f64;
        --lamie-rose-700: #7d4248;

        --color-canvas: var(--lamie-paper-50);
        --color-surface: var(--lamie-paper-0);
        --color-surface-subtle: var(--lamie-paper-100);
        --color-surface-strong: var(--lamie-stem-700);
        --color-overlay: rgb(52 43 39 / 0.78);
        --color-text-primary: var(--lamie-mocha-900);
        --color-text-secondary: var(--lamie-mocha-700);
        --color-text-muted: var(--lamie-mocha-500);
        --color-text-on-strong: var(--lamie-paper-0);
        --color-text-accent: var(--lamie-rose-700);
        --color-border-subtle: var(--lamie-paper-200);
        --color-border-strong: var(--lamie-mocha-500);
        --color-action-primary: var(--lamie-mocha-900);
        --color-action-primary-hover: #443833;
        --color-action-accent: var(--lamie-rose-700);
        --color-focus: var(--lamie-rose-500);
        --color-success-bg: #e5ece3;
        --color-success-text: #35533a;
        --color-warning-bg: #f4ead2;
        --color-warning-text: #6c531f;
        --color-danger-bg: #f4dede;
        --color-danger-text: #7b3439;

        --font-display: "Playfair Display", Georgia, serif;
        --font-body: "Zen Old Mincho", "Noto Serif", serif;
        --text-display-xl: clamp(3.5rem, 7vw, 6.75rem);
        --text-display-lg: clamp(2.75rem, 5vw, 5rem);
        --text-heading-1: clamp(2.25rem, 4vw, 3.75rem);
        --text-heading-2: clamp(1.875rem, 3vw, 2.75rem);
        --text-heading-3: clamp(1.375rem, 2vw, 1.75rem);
        --text-body-lg: 1.125rem;
        --text-body: 1rem;
        --text-body-sm: 0.875rem;
        --text-label: 0.75rem;
        --leading-display: 0.98;
        --leading-heading: 1.12;
        --leading-body: 1.65;
        --leading-compact: 1.35;
        --tracking-display: -0.035em;
        --tracking-heading: -0.02em;
        --tracking-label: 0.09em;

        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 0.75rem;
        --space-4: 1rem;
        --space-5: 1.25rem;
        --space-6: 1.5rem;
        --space-8: 2rem;
        --space-10: 2.5rem;
        --space-12: 3rem;
        --space-16: 4rem;
        --space-20: 5rem;
        --space-24: 6rem;
        --space-32: 8rem;
        --space-page-x: clamp(1rem, 4vw, 3rem);
        --space-section-y: clamp(4.5rem, 9vw, 8rem);
        --space-section-y-compact: clamp(3rem, 6vw, 5rem);
        --space-grid: clamp(1rem, 2.5vw, 2.5rem);

        --radius-xs: 0.25rem;
        --radius-sm: 0.5rem;
        --radius-md: 0.75rem;
        --radius-lg: 1rem;
        --radius-xl: 1.5rem;
        --radius-pill: 999px;
        --shadow-xs: 0 1px 2px rgb(85 70 62 / 0.08);
        --shadow-sm: 0 6px 18px rgb(85 70 62 / 0.09);
        --shadow-md: 0 16px 40px rgb(85 70 62 / 0.12);
        --shadow-lg: 0 28px 72px rgb(52 43 39 / 0.18);
        --shadow-focus: 0 0 0 3px rgb(164 95 100 / 0.28);

        --container-reading: 42rem;
        --container-form: 36rem;
        --container-content: 75rem;
        --container-wide: 87.5rem;
        --container-bleed: 100rem;
        --duration-fast: 180ms;
        --duration-base: 260ms;
        --duration-slow: 420ms;
        --ease-standard: cubic-bezier(0.2, 0, 0, 1);
        --ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--color-canvas);
        color: var(--color-text-primary);
        font-family: var(--font-body);
        font-size: var(--text-body);
        line-height: var(--leading-body);
        text-rendering: optimizeLegibility;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-display);
        color: var(--color-text-primary);
        letter-spacing: var(--tracking-heading);
        text-wrap: balance;
      }

      p {
        text-wrap: pretty;
      }

      button, input, textarea, select {
        font: inherit;
      }

      button, a, input, textarea, select {
        -webkit-tap-highlight-color: transparent;
      }

      :focus-visible {
        outline: 2px solid var(--color-focus);
        outline-offset: 3px;
      }

      ::selection {
        background: var(--lamie-rose-100);
        color: var(--color-text-primary);
      }

      .lamie-page-container {
        width: min(var(--container-content), calc(100% - (2 * var(--space-page-x))));
        margin-inline: auto;
      }

      .lamie-page-container--wide {
        width: min(var(--container-wide), calc(100% - (2 * var(--space-page-x))));
      }

      .lamie-page-container--reading {
        width: min(var(--container-reading), calc(100% - (2 * var(--space-page-x))));
      }

      .lamie-page-container--form {
        width: min(var(--container-form), calc(100% - (2 * var(--space-page-x))));
      }

      .lamie-section-space {
        padding-block: var(--space-section-y);
      }

      .lamie-section-space--compact {
        padding-block: var(--space-section-y-compact);
      }

      .lamie-card {
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-md);
        background: var(--color-surface);
      }

      .lamie-card--raised {
        border-color: transparent;
        box-shadow: var(--shadow-sm);
      }

      .lamie-card--subtle {
        background: var(--color-surface-subtle);
      }

      .lamie-control {
        width: 100%;
        min-height: 2.75rem;
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-sm);
        background: var(--color-surface);
        color: var(--color-text-primary);
        padding: 0.75rem 0.875rem;
        line-height: var(--leading-compact);
        transition: border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard), background-color var(--duration-fast) var(--ease-standard);
      }

      .lamie-control::placeholder {
        color: var(--color-text-muted);
        opacity: 0.78;
      }

      .lamie-control:hover:not(:disabled) {
        border-color: var(--lamie-mocha-300);
      }

      .lamie-control:focus {
        border-color: var(--color-focus);
        box-shadow: var(--shadow-focus);
        outline: none;
      }

      .lamie-control:disabled {
        cursor: not-allowed;
        background: var(--color-surface-subtle);
        color: var(--color-text-muted);
        opacity: 0.72;
      }

      .lamie-control[aria-invalid="true"] {
        border-color: var(--color-danger-text);
      }

      .lamie-tabular {
        font-variant-numeric: tabular-nums lining-nums;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-surface-subtle);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--lamie-mocha-200);
        border-radius: var(--radius-xs);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--lamie-mocha-400);
      }
      @keyframes filmTrack {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }
      .animate-film-track {
        animation: filmTrack 52s linear infinite;
      }
      .animate-film-track-delay {
        animation: filmTrack 62s linear infinite;
        animation-delay: -18s;
      }
      .animate-film-track-slow {
        animation: filmTrack 72s linear infinite;
        animation-delay: -32s;
      }
      .animate-gallery-marquee {
        animation: filmTrack 96s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body class="bg-cream-100 text-mocha-800 antialiased selection:bg-mocha-100 selection:text-mocha-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
